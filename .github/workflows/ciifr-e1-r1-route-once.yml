name: CIIFR E1 R1 native routing projection
on:
  push:
    branches: [pp/ciifr-r4-home-onboarding-protocol-20261025]
    paths: ['.github/workflows/ciifr-e1-r1-route-once.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record native E1 R1 route via official pp_cli
        shell: bash
        run: |
          set -euo pipefail
          python tools/pp_cli.py 'check' '--base' 'origin/main'
          python tools/pp_cli.py 'card' 'set' '--project' 'ciifr' '--card' 'wbs4-e1-ptrguard' '--state' 'NOT_STARTED' '--now' 'Oracle reconciled independent E1 PARTIAL and published native E1-PTR-GUARD-1 task #173. Fix invalid BEND/count and other auxiliary pointer targets on existing draft PR168; no active recipient or implementation return yet. Contributor must pass AGENTS Appendix A and local backup/ledger rules before editing. No product writer or merge.' '--next-actor' 'Owner routes #173 → qualified E1 corrective contributor' '--next-text' 'Send issue #173 to one qualified builder. They verify PR168 exact head, source-field CONTROL map and sole-writer scope, implement minimal read-only tests/fix, then return exact-head evidence for independent reviewer replay.' '--role' 'E1 R1 corrective contributor, NOT YET BOUND' '--ref' 'issue|E1 R1 repair task|https://github.com/reallakshman19/XML_Compare_Utilities/issues/173' '--actor' 'CIIFR Oracle (cycle-style native continuation)' '--src' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/170#issuecomment-6396558970' '--summary' 'Link separate E1 R1 native task without promoting pending work to started.'
          python tools/pp_cli.py 'fixture' 'add' '--project' 'ciifr' '--list' 'issues' '--text' 'E1-PTR-GUARD-1 corrective task #173 published. Same draft PR168, preserve reviewer #170 independence; qualified coder unbound, no receipt/implementation. Repo AGENTS Appendix A and local safety ledger required before patch.' '--url' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/173' '--status' 'R1_ISSUED_NOT_SENT' '--milestone' 'M18' '--actor' 'CIIFR Oracle (cycle-style native continuation)' '--src' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/170#issuecomment-6396558970' '--summary' 'Record source-linked E1 corrective task, not execution.'
          python tools/pp_cli.py 'check' '--base' 'origin/main'
          python tools/pp_cli.py 'triggers'
      - name: Commit checked CIIFR data; remove one-shot recorder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CIIFR Progress Recorder"
          git config user.email "ciifr-progress-bot@users.noreply.github.com"
          git rm -f .github/workflows/ciifr-e1-r1-route-once.yml
          git add data/ciifr/
          git commit -m "data(ciifr): route E1 R1 repair without execution claim"
          git push origin HEAD:refs/heads/pp/ciifr-r4-home-onboarding-protocol-20261025
