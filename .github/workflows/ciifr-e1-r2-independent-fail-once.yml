name: CIIFR E1 R2 independent-fail reconciliation
on:
  push:
    branches: [pp/ciifr-r4-home-onboarding-protocol-20261025]
    paths: ['.github/workflows/ciifr-e1-r2-independent-fail-once.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile independent E1 FAIL with official CLI
        shell: bash
        run: |
          set -euo pipefail
          python tools/pp_cli.py 'check' '--base' 'origin/main'
          python tools/pp_cli.py 'card' 'set' '--project' 'ciifr' '--card' 'wbs4-e1-ptrguard' '--state' 'IN_PROGRESS' '--now' 'PR168 R1 head 01d94e1f independently FAILED #170 6400040909: empty counted RESTRANT header accepted (F1), valid 2-row REDUCERS rejected while invalid 1-row accepted (F2), surplus CONTROL fields accepted with v14 strictness unresolved (F3). Original BEND/EXPJT/EQUIP pointer corrections PASS. Oracle issued R2 SAME-PR FIX_REQUIRED to coder 6adddf80; no new implementation return.' '--next-actor' 'Coder 6adddf80 · R2 minimal correction on PR168' '--next-text' 'Read R2 GO #173 6400196426, verify exact HEAD and local backups/ledger, fix empty RESTRANT body fail-closed and REDUCERS 2-line v14 cardinality, source-dispose CONTROL row strictness F3. Retain BEND/EXPJT/EQUIP and 30 old tests; return new exact head for independent replay.' '--role' 'Coder 6adddf80 · R1 failed independent review · R2 instructed, no receipt' '--ref' 'comment|Independent E1 R1 FAIL|https://github.com/reallakshman19/XML_Compare_Utilities/issues/170#issuecomment-6400040909' '--ref' 'comment|Oracle R2 correction GO|https://github.com/reallakshman19/XML_Compare_Utilities/issues/173#issuecomment-6400196426' '--actor' 'CIIFR Oracle · E1 R2 correction' '--src' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/170#issuecomment-6400185309' '--summary' 'Reconcile independently proven structural failures and bounded R2 correction without accepting failed R1.'
          python tools/pp_cli.py 'card' 'set' '--project' 'ciifr' '--card' 'wbs4-e1-specialist' '--state' 'SUBMITTED' '--now' 'Independent E1 specialist returned exact-head FAIL #170 6400040909 at PR168 01d94e1f: original BEND/EXPJT/IZUP and RIGID/NodeName cases PASS, but empty RESTRANT and REDUCERS physical layout FAIL, CONTROL strict-row handling PARTIAL/FAIL. No private CAESAR import. Reviewer awaiting Oracle challenge; Oracle now ordered same-coder R2.' '--next-actor' 'Coder R2 correction → same independent E1 specialist' '--next-text' 'Preserve exact-head FAIL and independent source-derived expectations. Do not review again until coder returns a new PR168 head; then replay independently the F1/F2 contrary cases, CONTROL version admissibility and retained guards. No reviewer edits.' '--role' 'Independent E1 specialist · repaired-head FAIL returned · awaiting R2 head' '--ref' 'comment|E1 repaired-head independent FAIL|https://github.com/reallakshman19/XML_Compare_Utilities/issues/170#issuecomment-6400040909' '--ref' 'comment|Oracle FAIL challenge|https://github.com/reallakshman19/XML_Compare_Utilities/issues/170#issuecomment-6400185309' '--actor' 'CIIFR Oracle · E1 R2 correction' '--src' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/170#issuecomment-6400185309' '--summary' 'Record reviewer FAIL outcome without claiming engineering acceptance.'
          python tools/pp_cli.py 'card' 'set' '--project' 'ciifr' '--card' 'wbs4-e1' '--state' 'IN_PROGRESS' '--now' 'E1 source catalogue FIX_REQUIRED after independent specialist FAIL on draft PR168 01d94e1f: missing RESTRANT body and incorrect REDUCERS two-row validation confirmed; CONTROL row strictness source-qualified decision pending. R2 correction routed under #173 to same coder. No E2/E3/TARGET1, private model or CAESAR release.' '--next-actor' 'Same E1 coder 6adddf80 → independent #170 replay' '--next-text' 'Complete narrowly bounded R2 on existing draft PR168; exact-head native regression and independent re-review. Source-qualify v14 CONTROL before strictness claims. E2/E3 and engineering acceptance HOLD.' '--role' 'E1 read-only catalogue · independent FAIL · minimal R2 corrective cycle' '--ref' 'comment|Independent E1 fail|https://github.com/reallakshman19/XML_Compare_Utilities/issues/170#issuecomment-6400040909' '--actor' 'CIIFR Oracle · E1 R2 correction' '--src' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/170#issuecomment-6400185309' '--summary' 'Align WBS E1 acceptance to independent failure and limited R2 repair.'
          python tools/pp_cli.py 'fixture' 'add' '--project' 'ciifr' '--list' 'issues' '--text' 'PR168 R1 exact 01d94e1f independently FAILED: empty RESTRANT count1/ptr4=1 wrongly accepted; REDUCERS v14 two physical rows wrongly rejected, one incomplete accepted. Previously fixed BEND/EXPJT/IZUP range guards retain bounded PASS.' '--url' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/170#issuecomment-6400040909' '--status' 'E1_R1_FAIL' '--milestone' 'M18' '--actor' 'CIIFR Oracle · E1 R2 correction' '--src' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/170#issuecomment-6400185309' '--summary' 'Record source-grounded E1 R1 FAIL and R2 bounded corrective work.'
          python tools/pp_cli.py 'fixture' 'add' '--project' 'ciifr' '--list' 'knownIssues' '--text' 'F3 CONTROL: extra numeric fields accepted by parser, but native v14 admissibility of padded CONTROL rows unproven. Oracle R2 demands source decision before any strict-width rule; version-bracketed v12/v15 evidence alone not full v14 signoff.' '--url' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/170#issuecomment-6400185309' '--status' 'CONTROL_SOURCE_HOLD' '--milestone' 'M18' '--actor' 'CIIFR Oracle · E1 R2 correction' '--src' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/170#issuecomment-6400185309' '--summary' 'Record source-grounded E1 R1 FAIL and R2 bounded corrective work.'
          python tools/pp_cli.py 'fixture' 'add' '--project' 'ciifr' '--list' 'pending' '--text' 'Same E1 coder 6adddf80 instructed R2 minimal same-PR correction #173 6400196426. New head not returned. Reviewer #170 replays F1/F2/F3 and retained pointer negatives only after builder return; engineering release/merge HOLD.' '--url' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/173#issuecomment-6400196426' '--status' 'R2_RETURN_PENDING' '--milestone' 'M18' '--actor' 'CIIFR Oracle · E1 R2 correction' '--src' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/170#issuecomment-6400185309' '--summary' 'Record source-grounded E1 R1 FAIL and R2 bounded corrective work.'
          python tools/pp_cli.py 'check' '--base' 'origin/main'
          python tools/pp_cli.py 'triggers'
      - name: Save failure diagnostics if needed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ciifr-e1-r2-progress-cli-diagnostic
          path: data/ciifr/
      - name: Commit validated data and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CIIFR Progress Recorder"
          git config user.email "ciifr-progress-bot@users.noreply.github.com"
          git rm -f .github/workflows/ciifr-e1-r2-independent-fail-once.yml
          git add data/ciifr/
          git commit -m "data(ciifr): record independent E1 FAIL and bounded R2 repair route"
          git push origin HEAD:refs/heads/pp/ciifr-r4-home-onboarding-protocol-20261025
