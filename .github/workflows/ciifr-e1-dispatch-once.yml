name: CIIFR E1 issue and relay projection
on:
  push:
    branches: [pp/ciifr-r4-home-onboarding-protocol-20261025]
    paths: ['.github/workflows/ciifr-e1-dispatch-once.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record source-only E1 specialist task with checked official CLI
        shell: bash
        run: |
          set -euo pipefail
          python tools/pp_cli.py 'check' '--base' 'origin/main'
          python tools/pp_cli.py 'card' 'set' '--project' 'ciifr' '--card' 'wbs4-e1-specialist' '--label' 'E1 · Independent field-map specialist' '--group' 'wbs4-intake' '--milestone' 'M18' '--state' 'NOT_STARTED' '--now' 'Owner authorized one independent v14 field-mapping specialist. Native source-only issue #170 was published with exact Oracle PR #168 candidate 3595a7c. NO receiver/chat bound, no agent acknowledgement or independent field findings. Public Common source relay PR #479 is DRAFT, not canonical; private model NOT_DELIVERED.' '--next-actor' 'Owner → one new read-only E1 specialist chat' '--next-text' 'Paste native issue #170 to recipient; specialist checks GitHub source access, v14 external field semantics, and returns independent falsifier evidence on #170. No Cycle now or writer.' '--role' 'Independent specialist (recipient UNBOUND)' '--ref' 'issue|Native E1 manual task|https://github.com/reallakshman19/XML_Compare_Utilities/issues/170' '--order' '41' '--actor' 'CIIFR Oracle (Owner-authorized E1 routing)' '--src' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/170#issuecomment-6395565914' '--summary' 'Record authorized E1 source task, distinct from receiver execution or E1 engineering acceptance.'
          python tools/pp_cli.py 'fixture' 'add' '--project' 'ciifr' '--list' 'issues' '--text' 'E1-FIELD-MAP-1 published as native manual-route issue #170: independent read-only CAESAR v14 slot/unit/sentinel/rigid falsification; task not received by any bound chat.' '--url' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/170' '--status' 'TASK_PUBLISHED' '--note' 'Recipient unbound' '--milestone' 'M18' '--actor' 'CIIFR Oracle (Owner-authorized E1 routing)' '--src' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/170#issuecomment-6395565914' '--summary' 'Record E1 native TASK_PUBLISHED and actual access boundary.'
          python tools/pp_cli.py 'fixture' 'add' '--project' 'ciifr' '--list' 'inputs' '--text' 'Common source artifact relay PR #479 has sanitized E1 record pointing to immutable XCU PR #168 files; currently DRAFT/PROPOSED, not merged, received or byte-verified. Owner-held private CII NOT_DELIVERED.' '--url' 'https://github.com/reallakshman19/Common/pull/479' '--status' 'RELAY_PROPOSED' '--note' 'Public code paths only' '--milestone' 'M18' '--actor' 'CIIFR Oracle (Owner-authorized E1 routing)' '--src' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/170#issuecomment-6395565914' '--summary' 'Record E1 native RELAY_PROPOSED and actual access boundary.'
          python tools/pp_cli.py 'fixture' 'add' '--project' 'ciifr' '--list' 'pending' '--text' 'Owner next action: paste native issue #170 to ONE E1 specialist chat and obtain recipient readback; no ACTIVE CIIFR Cycle, no auto send. Public-source read-only work can start without private CII.' '--url' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/170#issuecomment-6395565914' '--status' 'DISPATCH_PENDING' '--note' 'No agent confirmed' '--milestone' 'M18' '--actor' 'CIIFR Oracle (Owner-authorized E1 routing)' '--src' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/170#issuecomment-6395565914' '--summary' 'Record E1 native DISPATCH_PENDING and actual access boundary.'
          python tools/pp_cli.py 'check' '--base' 'origin/main'
          python tools/pp_cli.py 'triggers'
      - name: Preserve failed candidate evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ciifr-e1-progress-diagnostic
          path: data/ciifr/
      - name: Commit CLI-checked data and remove one-shot recorder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CIIFR Progress Recorder"
          git config user.email "ciifr-progress-bot@users.noreply.github.com"
          git rm -f .github/workflows/ciifr-e1-dispatch-once.yml
          git add data/ciifr/
          git commit -m "data(ciifr): record E1 source task and relay proposal without recipient claim"
          git push origin HEAD:refs/heads/pp/ciifr-r4-home-onboarding-protocol-20261025
