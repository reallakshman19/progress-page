name: Agent Start live browser acceptance
on:
  push:
    branches: ['qa/agent-start-live-e2e-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install chromium
      - name: Exercise the LIVE GitHub Pages site in Chromium
        run: python tests/live-agent-start.e2e.py
        env:
          PROGRESS_PAGE_URL: https://reallakshman19.github.io/progress-page/
          PP_E2E_OUTPUT: e2e-output
      - name: Always preserve screenshots, handoff and outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-start-live-browser-evidence
          path: e2e-output/
          retention-days: 14
