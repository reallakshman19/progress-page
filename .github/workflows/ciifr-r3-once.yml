name: One-time CIIFR R3 subtitle audit correction
on:
  push:
    branches: [bootstrap/ciifr-r3-native-cli-20261024]
permissions:
  contents: write
jobs:
  correct:
    if: github.repository == 'reallakshman19/progress-page'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pp/ciifr-r3-20261024
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply checked R3 subtitle transaction and extend audit
        shell: bash
        run: |
          set -euo pipefail
          python tools/pp_cli.py check
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          import pp_ops as O, pp_lib as L
          root, docs = O.open_project('data','ciifr')
          assert docs['index']['revisions'][-1]['id']=='R3'
          assert docs['index']['revisions'][-1]['status']=='current'
          p = docs['index']['project']
          assert p['subtitle'] == 'Preview from the OTM board. The CIIFR Oracle owns the real data (standalone mode).'
          p['subtitle'] = 'R3 current: standalone Oracle coordination of P2.5-B handoff, review, Windows acceptance and prepared Oracle succession.'
          O.record(docs,'ciifr','PLAN','Oracle','Replace stale OTM preview subtitle with Owner-directed standalone R3 scope','OWNER_PRIVATE_REF:ciifr-r3-owner-intent-20261024',scope='subtitle')
          tx=L.Txn()
          O.save(tx,root,docs,('index','audit'))
          L.finish(tx,'data')
          print('SUBTITLE TRANSACTION: PASS')
          PY
          python tools/pp_cli.py check
          python tools/pp_cli.py check --base origin/main
          git add data/ciifr/index.json data/ciifr/audit.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(ciifr): correct stale OTM subtitle with audited R3 transaction'
          git push origin HEAD:refs/heads/pp/ciifr-r3-20261024
