name: Check progress data
on:
  pull_request:
    paths: ['data/**', 'tools/**', 'tests/**', 'ci/**', 'proposals/**', '*.js']
  push:
    branches: [main]
    paths: ['data/**', 'tools/**', 'tests/**', 'ci/**', 'proposals/**', '*.js']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Show PR Page-data publication boundary
        if: github.event_name == 'pull_request'
        run: python ci/pp_publication_scope.py --base origin/${{ github.base_ref }}
      - name: Contract check
        run: python tools/pp_check.py data
      - name: The Timeline only grew and nothing was deleted
        if: github.event_name == 'pull_request'
        run: python tools/pp_check.py data --base origin/${{ github.base_ref }}
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Agent Start task/deep-link regression
        run: node --experimental-default-type=module --test tests/agent-start.test.mjs
      - name: Per-project Test page local demo and isolation checks
        run: node --experimental-default-type=module --test tests/test-page.test.mjs
      - name: Trials V3 universal template schema, isolation and source safety
        run: node --experimental-default-type=module --test tests/trial-workspace-v3.test.mjs
      - name: Property Transfer prototype trial readiness and safety
        run: node --experimental-default-type=module --test tests/prototype-trial.test.mjs
      - name: Adhoc Projects nested workspace navigation and read-only boundaries
        run: node --experimental-default-type=module --test tests/adhoc-projects.test.mjs
      - name: TOPO-A and TOPO-B Adhoc Cycle Board source and authority falsifiers
        run: node --experimental-default-type=module --test tests/adhoc-topo-cycle-board.test.mjs
      - name: Shared Smart Badge identifiers / writer / Agent Start / Oracle tests
        run: node --experimental-default-type=module --test tests/smart-badges.test.mjs
      - name: Cycle now via Timeline live-source privacy and WBS regressions
        run: node --experimental-default-type=module --test tests/timeline-live.test.mjs
      - name: CT-1 Cycle Board source-bound native and Page context falsifiers
        run: node --experimental-default-type=module --test tests/cycle-board-context.test.mjs
      - name: CT-2 Cycle Board changed-only and continuation negative cases
        run: node --experimental-default-type=module --test tests/cycle-board-delta.test.mjs
      - name: CT-3 Cycle Board writer preview and duplicate-source restrictions
        run: node --experimental-default-type=module --test tests/cycle-board-writer.test.mjs
      - name: CT-4 three-project adversarial replay (author-only, not independent IR)
        run: node --experimental-default-type=module --test tests/cycle-board-ct4-project-matrix.test.mjs
      - name: Onboarding readiness contrasts
        run: node --experimental-default-type=module --test tests/onboarding.test.mjs
      - name: Project Home navigation and source-retention tests
        run: node --experimental-default-type=module --test tests/project-home.test.mjs
      - name: CIIFR ROI classification, no-mutation and contrary tests
        run: node --experimental-default-type=module --test tests/roi.test.mjs
      - name: Original CIIFR ROI source hash manifest
        run: node --experimental-default-type=module tools/ciifr_roi_inventory.mjs
      - name: WBS family navigation regressions
        run: node --experimental-default-type=module --test tests/wbs-subtabs.test.mjs
      - name: Historical revision and WBS routing regressions
        run: node --experimental-default-type=module --test tests/revision-wbs.test.mjs
      - name: Global search and Oracle continuity regressions
        run: node --experimental-default-type=module --test tests/search.test.mjs tests/oracle-continuity.test.mjs
      - name: Seeded-defect tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s tests -v
