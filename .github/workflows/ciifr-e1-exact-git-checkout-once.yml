name: CIIFR E1 exact-head native checkout handoff
on:
  push:
    branches: [pp/ciifr-r4-home-onboarding-protocol-20261025]
    paths: ['.github/workflows/ciifr-e1-exact-git-checkout-once.yml']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clone and certify public XCU PR168 Git checkout
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          EXPECTED=3595a7cf350d22a982157d7dffdec2becf6b0f4a
          BASE=80e693bd81f54003a487cb763421f9bfd0d3dfc2
          git clone --single-branch --branch codex/ciifr-wbs4-oracle-e0-e1-20261025 https://github.com/reallakshman19/XML_Compare_Utilities.git xcu-pr168
          test "$(git -C xcu-pr168 rev-parse HEAD)" = "$EXPECTED"
          test "$(git -C xcu-pr168 rev-parse --is-shallow-repository)" = false
          git -C xcu-pr168 cat-file -e "$BASE^{commit}"
          git -C xcu-pr168 merge-base --is-ancestor "$BASE" "$EXPECTED"
          git -C xcu-pr168 fsck --full --no-reflogs
          test -z "$(git -C xcu-pr168 status --porcelain)"
          test -f xcu-pr168/utils/backup.cjs
          test -f xcu-pr168/tests/cii-fnr-vnext-branch-scope.test.mjs
          test -f xcu-pr168/tools/ciifr-wbs4/readonly-catalog.mjs
          test -f xcu-pr168/tests/ciifr-wbs4-readonly-catalog.test.mjs
          printf 'SOURCE_REPOSITORY=reallakshman19/XML_Compare_Utilities\nSOURCE_BRANCH=codex/ciifr-wbs4-oracle-e0-e1-20261025\nEXPECTED_PR168_HEAD=%s\nBASE=%s\nPROVENANCE=GitHub Actions full-history public git clone with .git retained\nINPUT_SCOPE=public repository only; NO private CII\n' "$EXPECTED" "$BASE" > checkout-manifest.txt
          git -C xcu-pr168 rev-parse HEAD >> checkout-manifest.txt
          git -C xcu-pr168 rev-parse --show-toplevel >> checkout-manifest.txt
          git -C xcu-pr168 diff --stat "$BASE" "$EXPECTED" >> checkout-manifest.txt
          tar -czf xcu-pr168-full-git-3595a7cf.tar.gz -C xcu-pr168 .
          sha256sum xcu-pr168-full-git-3595a7cf.tar.gz | tee checkout-sha256.txt
          du -h xcu-pr168-full-git-3595a7cf.tar.gz
      - name: Upload verified checkout artifact
        uses: actions/upload-artifact@v4
        with:
          name: ciifr-e1-pr168-native-git-checkout-3595a7cf
          path: |
            xcu-pr168-full-git-3595a7cf.tar.gz
            checkout-manifest.txt
            checkout-sha256.txt
          retention-days: 14
          if-no-files-found: error
      - name: Delete one-shot packaging workflow from Progress PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CIIFR Oracle Handoff"
          git config user.email "ciifr-progress-bot@users.noreply.github.com"
          git rm -f .github/workflows/ciifr-e1-exact-git-checkout-once.yml
          git commit -m "chore(ciifr): remove one-shot native checkout packaging workflow"
          git push origin HEAD:refs/heads/pp/ciifr-r4-home-onboarding-protocol-20261025
