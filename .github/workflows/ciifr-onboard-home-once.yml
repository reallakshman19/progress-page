name: CIIFR Project Home onboarding source projection
on:
  push:
    branches: [pp/ciifr-r4-home-onboarding-protocol-20261025]
    paths: ['.github/workflows/ciifr-onboard-home-once.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply revised Home and onboarding projection using pp_cli
        shell: bash
        run: |
          set -euo pipefail
          python tools/pp_cli.py 'check' '--base' 'origin/main'
          python tools/pp_cli.py 'card' 'set' '--project' 'ciifr' '--card' 'wbs4-e0' '--state' 'SUBMITTED' '--now' 'Oracle E0 framework and new Project Home concept are in XCU draft PR #168 at 3595a7c: Owner outcome, original 15-line ELEMENTS/53 real/15 pointer architecture, shared node vs pointer semantics, private hash-only custody, uncertainty and 3 connected tasks. Source author SELF_ASSESSED; not a production feature or engineering approval.' '--next-actor' 'Authorized CIIFR Oracle' '--next-text' 'Use revised START HERE Map A to verify CIIFR Home and native WBS links, then challenge v14 field meaning independently; keep draft and acceptance distinct.' '--ref' 'pr|Current Project Home concept|https://github.com/reallakshman19/XML_Compare_Utilities/pull/168' '--actor' 'CIIFR Oracle (source-grounded self-assessment)' '--src' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/167#issuecomment-6395368222' '--summary' 'Ground E0 in revised Project Home concept while retaining submitted status.'
          python tools/pp_cli.py 'card' 'set' '--project' 'ciifr' '--card' 'wbs4-e1' '--state' 'IN_PROGRESS' '--now' 'E1-FIELD-MAP-1 onboarding packet revised per Common START HERE Maps B/C. XCU PR #168 is draft; source tests 6/6 and retained NodeName 19/19 at b09d0ed, engineering semantics NOT_RUN. No E1 recipient confirmed, Common relay NOT_REGISTERED, no Cycle CURRENT for ciifr. Prepared is not sent, received, verified or native approval.' '--next-actor' 'Authorized Oracle, then selected E1 specialist' '--next-text' 'Issue #167 → WBS4.1 → Home → actual Common task relay/access; select independent unit/ordinal/sentinel falsifier and authorized manual/native route (Cycle only if ACTIVE).' '--ref' 'pr|Revised E1 agent packet|https://github.com/reallakshman19/XML_Compare_Utilities/pull/168' '--actor' 'CIIFR Oracle (source-grounded self-assessment)' '--src' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/167#issuecomment-6395368222' '--summary' 'Project revised seven onboarding observations and prepared-not-sent state.'
          python tools/pp_cli.py 'fixture' 'add' '--project' 'ciifr' '--list' 'repository' '--text' 'CIIFR Project Home concept note: Owner user journey, why, working NodeName vs intended typed Element/RIGID editor, 53-real/15-pointer architecture, v14 uncertainties, exact original custody and next 3 WBS tasks.' '--url' 'https://github.com/reallakshman19/XML_Compare_Utilities/blob/3595a7cf350d22a982157d7dffdec2becf6b0f4a/docs/ciifr/WBS4_PROJECT_HOME_CONCEPT.md' '--status' 'CONCEPT_NOTE' '--milestone' 'M17' '--note' 'Oracle authored' '--actor' 'CIIFR Oracle (source-grounded self-assessment)' '--src' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/167#issuecomment-6395368222' '--summary' 'Apply revised START HERE protocol to CIIFR Home and E1 onboarding.'
          python tools/pp_cli.py 'fixture' 'add' '--project' 'ciifr' '--list' 'repository' '--text' 'Complex CII architecture: element ordinal is file-local; FROM/TO endpoints form shared node graph; pointer #2 RIGID and #12 NODENAME index auxiliary records. Sentinels/units depend on field; independent field-map review pending.' '--url' 'https://github.com/reallakshman19/XML_Compare_Utilities/blob/3595a7cf350d22a982157d7dffdec2becf6b0f4a/docs/ciifr/WBS4_PROJECT_HOME_CONCEPT.md' '--status' 'ARCHITECTURE_CONCEPT' '--milestone' 'M18' '--note' 'Self assessed' '--actor' 'CIIFR Oracle (source-grounded self-assessment)' '--src' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/167#issuecomment-6395368222' '--summary' 'Apply revised START HERE protocol to CIIFR Home and E1 onboarding.'
          python tools/pp_cli.py 'fixture' 'add' '--project' 'ciifr' '--list' 'repository' '--text' 'Revised E1 OnBoard prompt: issue -> WBS 4.1 -> Project Home -> real Common relay input -> recipient checks -> selected native protocol. Seven observations; Cycle now only under ACTIVE CIIFR Cycle; v3.6 only if selected.' '--url' 'https://github.com/reallakshman19/XML_Compare_Utilities/blob/3595a7cf350d22a982157d7dffdec2becf6b0f4a/docs/ciifr/WBS4_AGENT_ONBOARD_PACKET_DRAFT.md' '--status' 'ONBOARD_REVISED' '--milestone' 'M18' '--note' 'Prepared only' '--actor' 'CIIFR Oracle (source-grounded self-assessment)' '--src' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/167#issuecomment-6395368222' '--summary' 'Apply revised START HERE protocol to CIIFR Home and E1 onboarding.'
          python tools/pp_cli.py 'fixture' 'add' '--project' 'ciifr' '--list' 'inputs' '--text' 'E1 original-model artifact relay NOT_REGISTERED; no assigned recipient has retrieved or rehashed private CII. Source/test code lives at immutable PR #168 commit; register actual task-specific Common relay input before material cross-agent transfer.' '--url' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/167#issuecomment-6395368222' '--status' 'RELAY_NOT_REGISTERED' '--milestone' 'M18' '--note' 'No bytes passed' '--actor' 'CIIFR Oracle (source-grounded self-assessment)' '--src' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/167#issuecomment-6395368222' '--summary' 'Apply revised START HERE protocol to CIIFR Home and E1 onboarding.'
          python tools/pp_cli.py 'fixture' 'add' '--project' 'ciifr' '--list' 'roadmap' '--text' 'NEXT THREE CONNECTED: (1) E1 independently derive 53-real slot/unit/sentinel source map and pointer #2; (2) E2 implement one verified numeric field proposal after review; (3) E3 bounded RIGID Weight pointer-resolved editor after ownership challenge.' '--url' 'https://github.com/reallakshman19/XML_Compare_Utilities/blob/3595a7cf350d22a982157d7dffdec2becf6b0f4a/docs/ciifr/WBS4_PROJECT_HOME_CONCEPT.md' '--status' 'NEXT_THREE' '--milestone' 'M18' '--note' 'No GO for E2/E3' '--actor' 'CIIFR Oracle (source-grounded self-assessment)' '--src' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/167#issuecomment-6395368222' '--summary' 'Apply revised START HERE protocol to CIIFR Home and E1 onboarding.'
          python tools/pp_cli.py 'fixture' 'add' '--project' 'ciifr' '--list' 'pending' '--text' 'START_HERE revised onboarding state: PREPARED, NOT SENT, NOT RECEIVED, NOT BYTES_VERIFIED. No CIIFR canonical CURRENT.json; manual/native dispatch is permitted only under actual task authority; Cycle now cannot be issued yet.' '--url' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/167#issuecomment-6395368222' '--status' 'ONBOARD_NOT_SENT' '--milestone' 'M18' '--note' 'One next actor: Oracle' '--actor' 'CIIFR Oracle (source-grounded self-assessment)' '--src' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/167#issuecomment-6395368222' '--summary' 'Apply revised START HERE protocol to CIIFR Home and E1 onboarding.'
          python tools/pp_cli.py 'fixture' 'add' '--project' 'ciifr' '--list' 'pending' '--text' 'SOURCE STATE CORRECTION: Progress Page R4 PR #15 and Home PR #16 are MERGED, not draft. XCU Oracle PR #168 remains draft at 3595a7c; live Home browser render and recipient access NOT_RUN.' '--url' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/167#issuecomment-6395368222' '--status' 'STATUS_RECONCILED' '--milestone' 'M17' '--note' 'Viewer not inspected' '--actor' 'CIIFR Oracle (source-grounded self-assessment)' '--src' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/167#issuecomment-6395368222' '--summary' 'Apply revised START HERE protocol to CIIFR Home and E1 onboarding.'
          python tools/pp_cli.py 'fixture' 'add' '--project' 'ciifr' '--list' 'knownIssues' '--text' 'Source-exposure/independence: Oracle authored the E1 code and synthetic expected answers; six passing tests do not qualify v14 units, Material Number or Rigid Type semantics. Agent E1 must derive an independent reference and contrast.' '--url' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/167#issuecomment-6395368222' '--status' 'ORACLE_SELF_ASSESSED' '--milestone' 'M18' '--note' 'Domain review NOT_RUN' '--actor' 'CIIFR Oracle (source-grounded self-assessment)' '--src' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/167#issuecomment-6395368222' '--summary' 'Apply revised START HERE protocol to CIIFR Home and E1 onboarding.'
          python tools/pp_cli.py 'fixture' 'add' '--project' 'ciifr' '--list' 'intent' '--text' 'Revised Common START_HERE is a role/mode router, not a new dispatch authority. Project Home is source-grounded knowledge, Page a projection; no new owner revision needed for a documentation/onboarding change.' '--url' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/167#issuecomment-6395368222' '--status' 'PROTOCOL_APPLIED' '--milestone' 'M17' '--note' 'R4 unchanged' '--actor' 'CIIFR Oracle (source-grounded self-assessment)' '--src' 'https://github.com/reallakshman19/XML_Compare_Utilities/issues/167#issuecomment-6395368222' '--summary' 'Apply revised START HERE protocol to CIIFR Home and E1 onboarding.'
          python tools/pp_cli.py 'check' '--base' 'origin/main'
          python tools/pp_cli.py 'triggers'
      - name: Save diagnostic on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ciifr-home-cli-diagnostic
          path: data/ciifr/
      - name: Commit checked project data and delete temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CIIFR Progress Recorder"
          git config user.email "ciifr-progress-bot@users.noreply.github.com"
          git rm -f .github/workflows/ciifr-onboard-home-once.yml
          git add data/ciifr/
          git commit -m "data(ciifr): project revised Home and E1 agent onboarding states"
          git push origin HEAD:refs/heads/pp/ciifr-r4-home-onboarding-protocol-20261025
