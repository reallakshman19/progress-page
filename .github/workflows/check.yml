name: Check progress data
on:
  pull_request:
    paths: ['data/**', 'tools/**', 'tests/**', '*.js']
  push:
    branches: [main]
    paths: ['data/**', 'tools/**', 'tests/**', '*.js']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contract check
        run: python tools/pp_check.py data
      - name: The Timeline only grew and nothing was deleted
        if: github.event_name == 'pull_request'
        run: python tools/pp_check.py data --base origin/${{ github.base_ref }}
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Onboarding readiness contrasts
        run: node --experimental-default-type=module --test tests/onboarding.test.mjs
      - name: Project Home navigation and source-retention tests
        run: node --experimental-default-type=module --test tests/project-home.test.mjs
      - name: CIIFR ROI classification, no-mutation and contrary tests
        run: node --experimental-default-type=module --test tests/roi.test.mjs
      - name: Original CIIFR ROI source hash manifest
        run: node --experimental-default-type=module tools/ciifr_roi_inventory.mjs
      - name: WBS family navigation regressions
        run: node --experimental-default-type=module --test tests/wbs-subtabs.test.mjs
      - name: Historical revision and WBS routing regressions
        run: node --experimental-default-type=module --test tests/revision-wbs.test.mjs
      - name: Global search and Oracle continuity regressions
        run: node --experimental-default-type=module --test tests/search.test.mjs tests/oracle-continuity.test.mjs
      - name: Seeded-defect tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s tests -v
