name: One-shot CIIFR WBS5 audited classification
on:
  push:
    branches: [pp/ciifr-wbs5-map-20261026]
    paths:
      - 'tools/ciifr_wbs5_reconcile.py'
      - '.github/workflows/ciifr-wbs5-reconcile.yml'
permissions:
  contents: write
jobs:
  audit-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native audited milestone updates, contract and history checks
        run: python tools/ciifr_wbs5_reconcile.py
      - name: Commit only native CLI-written index and append-only audit records
        run: |
          git config user.name "CIIFR Progress Page recorder (Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ciifr/index.json data/ciifr/audit.json
          git diff --cached --check
          git diff --cached --quiet && { echo "No audited changes"; exit 1; }
          git commit -m "data(ciifr): assign existing M8-M11 to WBS5 via audited CLI [skip ci]"
          git push origin "HEAD:pp/ciifr-wbs5-map-20261026"
