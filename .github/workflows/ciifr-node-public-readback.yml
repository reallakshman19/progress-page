name: CIIFR-Node public Pages readback once
on:
  push:
    branches: [qa/ciifr-node-public-readback-20261028]
    paths: [.github/workflows/ciifr-node-public-readback.yml]
permissions:
  contents: read
jobs:
  verify-public-published-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently fetch public deployed projects and WBS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, json
          root='https://reallakshman19.github.io/progress-page/data/'
          def load(p):
              u=root+p+'?ciifr_node_rev=7112c0591d058b447b84dfe18c12f4af15757b81'
              with urllib.request.urlopen(urllib.request.Request(u,headers={'Cache-Control':'no-cache'}),timeout=30) as f:
                  body=f.read();print(p,'HTTP',f.status,'bytes',len(body))
              return json.loads(body)
          projects=load('projects.json')
          assert any(p['key']=='ciifr-node' for p in projects['projects'])
          i=load('ciifr-node/index.json')
          c=load('ciifr-node/cards.json')
          f=load('ciifr-node/fixtures.json')
          a=load('ciifr-node/audit.json')
          assert i['project']['key']=='ciifr-node'
          assert len(i['milestones'])==15
          assert len(c)==4
          assert len(a['events'])==29 and a['events'][-1]['id']=='CIIFR-NODE-R-0029'
          assert len(f['repository'])>=4 and len(f['inputs'])>=2
          print('CIIFR_NODE_PUBLIC_READBACK_PASS','milestones=15','cards=4','audit=29')
          PY
