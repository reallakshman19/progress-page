name: CIIFR-Node one-shot audited Page WBS setup
on:
  push:
    branches: [pp/ciifr-node-wbs-20261028]
    paths: [.github/workflows/ciifr-node-bootstrap.yml, proposals/ciifr_node_wbs_setup_once.py]
permissions:
  contents: write
jobs:
  generate-audited-page-data:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate reviewed CLI dry-run
        run: python proposals/ciifr_node_wbs_setup_once.py --page-root .
      - name: Execute official pp_cli and verify append-only Page history
        run: |
          python proposals/ciifr_node_wbs_setup_once.py --page-root . --apply
          python tools/pp_cli.py check
          python tools/pp_cli.py check --base origin/main
          python tools/pp_cli.py triggers --json
      - name: Guard data-only publication delta and commit on scoped branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "pp/ciifr-node-wbs-20261028"
          test -f data/ciifr-node/index.json
          test -f data/ciifr-node/audit.json
          git diff --name-only | grep -vE '^data/' && { echo "Non-data diff"; exit 1; } || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json data/ciifr-node
          git diff --cached --name-only
          git commit -m "data(ciifr-node): publish P0-P6 source-linked WBS and audited fixtures"
          git push origin HEAD:pp/ciifr-node-wbs-20261028
