name: All project tabs desktop layout
on:
  pull_request:
    paths:
      - 'viewer.css'
      - 'app.js'
      - 'lifecycle.js'
      - 'tests/test_all_tabs_layout.e2e.py'
      - '.github/workflows/all-tabs-layout-e2e.yml'
  push:
    branches: ['ux/all-project-tabs-desktop-*']
permissions:
  contents: read
jobs:
  all-tabs-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install chromium
      - name: Test PR code across 3 projects, 9 views and 4 screen widths
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/layout-server.log 2>&1 &
          python tests/test_all_tabs_layout.e2e.py
        env:
          PROGRESS_PAGE_URL: http://127.0.0.1:8765/
          PP_LAYOUT_OUTPUT: layout-output
      - name: Upload desktop/mobile comparisons and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-project-tabs-layout
          path: layout-output/
          retention-days: 14
